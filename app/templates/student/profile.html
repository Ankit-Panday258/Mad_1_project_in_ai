{% extends "base.html" %}

{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Student Profile</h3>
                <a href="{{ url_for('student.dashboard') }}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Dashboard
                </a>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                    <div class="form-text">System login username cannot be changed.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
                    <div class="form-text">Registered email address used for notifications.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Roll Number / Student ID</label>
                    <input type="text" class="form-control" value="{{ student.roll_no if student else 'N/A' }}" disabled>
                </div>

                <div class="mb-3">
                    <label for="full_name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ current_user.full_name }}" required>
                </div>

                <div class="mb-3">
                    <label for="department" class="form-label fw-semibold">Department</label>
                    <input type="text" class="form-control" id="department" name="department" value="{{ student.department if student else '' }}" placeholder="e.g. Computer Science">
                </div>

                <div class="mb-4">
                    <label for="contact_details" class="form-label fw-semibold">Phone / Contact Details</label>
                    <input type="text" class="form-control" id="contact_details" name="contact_details" value="{{ student.contact_details if student else '' }}" placeholder="e.g. +91 9876543210">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('student.dashboard') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i> Update Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
