{% extends "base.html" %}

{% block title %}{{ action }} Examination{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">{{ action }} Examination</h3>
                <a href="{{ url_for('admin.examinations') }}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Examinations
                </a>
            </div>

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label for="examination_name" class="form-label fw-semibold">Examination Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="examination_name" name="examination_name" value="{{ exam.examination_name if exam else '' }}" required placeholder="e.g. End-Term Project Viva Voce">
                    </div>

                    <div class="col-md-4">
                        <label for="course_id" class="form-label fw-semibold">Course <span class="text-danger">*</span></label>
                        <select class="form-select" id="course_id" name="course_id" required>
                            <option value="">Select Course</option>
                            {% for c in courses %}
                            <option value="{{ c.id }}" {% if exam and exam.course_id == c.id %}selected{% endif %}>
                                {{ c.course_code }} - {{ c.course_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="examination_type" class="form-label fw-semibold">Examination Type <span class="text-danger">*</span></label>
                        <select class="form-select" id="examination_type" name="examination_type" required>
                            {% for t in ['Viva', 'Practical', 'Project Demo', 'Assessment'] %}
                            <option value="{{ t }}" {% if exam and exam.examination_type == t %}selected{% endif %}>{{ t }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="duration" class="form-label fw-semibold">Duration (Minutes) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="duration" name="duration" value="{{ exam.duration if exam else 30 }}" min="5" max="300" required>
                    </div>

                    <div class="col-md-4">
                        <label for="max_marks" class="form-label fw-semibold">Maximum Marks <span class="text-danger">*</span></label>
                        <input type="number" step="0.5" class="form-control" id="max_marks" name="max_marks" value="{{ exam.max_marks if exam else 100.0 }}" min="1" required>
                    </div>

                    <div class="col-12"><hr class="my-2"></div>
                    <div class="col-12"><h5 class="fw-bold text-primary mb-1"><i class="bi bi-calendar-range me-2"></i>Examination Timelines</h5></div>

                    <div class="col-md-6">
                        <label for="slot_creation_start_date" class="form-label fw-semibold">Examiner Slot Creation Start <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="slot_creation_start_date" name="slot_creation_start_date" value="{{ exam.slot_creation_start_date if exam else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="slot_creation_end_date" class="form-label fw-semibold">Examiner Slot Creation End <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="slot_creation_end_date" name="slot_creation_end_date" value="{{ exam.slot_creation_end_date if exam else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="slot_booking_start_date" class="form-label fw-semibold">Student Booking Start <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="slot_booking_start_date" name="slot_booking_start_date" value="{{ exam.slot_booking_start_date if exam else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="slot_booking_end_date" class="form-label fw-semibold">Student Booking End <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="slot_booking_end_date" name="slot_booking_end_date" value="{{ exam.slot_booking_end_date if exam else '' }}" required>
                    </div>

                    <div class="col-12"><hr class="my-2"></div>

                    <div class="col-md-6">
                        <label for="status" class="form-label fw-semibold">Initial Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Draft" {% if not exam or exam.status == 'Draft' %}selected{% endif %}>Draft</option>
                            <option value="Slot Creation" {% if exam and exam.status == 'Slot Creation' %}selected{% endif %}>Slot Creation</option>
                            <option value="Booking Open" {% if exam and exam.status == 'Booking Open' %}selected{% endif %}>Booking Open</option>
                            <option value="Closed" {% if exam and exam.status == 'Closed' %}selected{% endif %}>Closed</option>
                            <option value="Completed" {% if exam and exam.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('admin.examinations') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Save Examination
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
