{% extends "base.html" %}

{% block title %}{{ action }} Course{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">{{ action }} Course</h3>
                <a href="{{ url_for('admin.courses') }}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back to Courses
                </a>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="course_code" class="form-label fw-semibold">Course Code <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="course_code" name="course_code" value="{{ course.course_code if course else '' }}" required placeholder="e.g. CS101 or MAD-1">
                    <div class="form-text">Unique uppercase identifier for this course.</div>
                </div>

                <div class="mb-3">
                    <label for="course_name" class="form-label fw-semibold">Course Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="course_name" name="course_name" value="{{ course.course_name if course else '' }}" required placeholder="e.g. Modern Application Development I">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Course Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Brief outline of syllabus or examination focus">{{ course.description if course else '' }}</textarea>
                </div>

                <div class="mb-4">
                    <label for="status" class="form-label fw-semibold">Course Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="active" {% if not course or course.status == 'active' %}selected{% endif %}>Active</option>
                        <option value="archived" {% if course and course.status == 'archived' %}selected{% endif %}>Archived</option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('admin.courses') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Save Course
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
